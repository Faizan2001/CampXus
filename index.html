<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CampXus - Schedule & Availability Tracker"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
       default-src 'self';
       script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebase.com https://*.firebaseapp.com https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net blob:;
       worker-src 'self' blob:;
       style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://use.fontawesome.com;
       font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://use.fontawesome.com;
       img-src 'self' data: blob: https://*.googleusercontent.com https://api.dicebear.com https://www.google.com;
       connect-src 'self' 
         https://*.firebase.com 
         https://*.firebaseapp.com 
         https://securetoken.googleapis.com 
         https://identitytoolkit.googleapis.com
         https://*.googleapis.com
         https://api.dicebear.com
         https://cdn.jsdelivr.net
         data: blob:
         wss://*.firebaseio.com;
       child-src 'self' blob:;
       frame-src 'none';
       object-src 'none';
       base-uri 'self';
       form-action 'self';
       "
    />
    <title>CampXus - Schedule & Availability Tracker</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    
    <!-- Main application styles -->
    <link rel="stylesheet" href="/src/css/styles.css" />

    <meta name="theme-color" content="#fafafa" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  </head>
  <body>
    <!-- App container is now visible by default again -->
    <div class="app-container">
      <!-- Top Navigation Bar -->
      <nav class="top-nav">
        <div class="nav-left">
          <div class="logo">
            <!-- 🎯 Learning: Make logo clickable to go home in SPA -->
            <span data-spa-route="home" style="cursor: pointer"
              >MeetchuThere</span
            >
          </div>
          <div class="nav-links">
            <!-- 🎯 Learning: Convert to SPA navigation using data-spa-route -->
            <a data-spa-route="home" class="nav-link" href="#home">
              <i class="fas fa-calendar-week"></i>
              <span class="nav-text">Schedule</span>
            </a>
            <a data-spa-route="friends" class="nav-link" href="#friends">
              <i class="fas fa-users"></i>
              <span class="nav-text">Friends</span>
            </a>
            <a data-spa-route="notifications" class="nav-link" href="#notifications">
              <i class="fas fa-bell"></i>
              <span class="nav-text">Notifications</span>
            </a>
          </div>
        </div>

        <div class="nav-right">
          <!-- Login Button (shown when not authenticated) -->
          <button id="login-btn" class="btn btn-primary login-btn">
            🎓 Join CampXus
          </button>

          <!-- User Profile Menu (shown when authenticated) -->
          <div class="user-menu" id="userMenu" style="display: none">
            <button
              type="button"
              class="user-menu-trigger"
              id="userMenuTrigger"
              aria-expanded="false"
              aria-label="User menu"
              title="Open user menu"
            >
              <!-- Default avatar icon (will be replaced with custom avatar) -->
              <div class="user-avatar-trigger" id="userAvatarTrigger">
                <i class="fas fa-user-circle"></i>
              </div>
            </button>

            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-header">
                <div class="user-avatar-large" id="userAvatarLarge">
                  <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                  <strong class="user-name" id="userDropdownName"
                    >John Doe</strong
                  >
                  <span class="user-email" id="userDropdownEmail"
                    >john@university.edu</span
                  >
                </div>
              </div>

              <div class="dropdown-menu">
                <a
                  data-spa-route="profile"
                  class="dropdown-item"
                  id="profileSetupBtn"
                  href="#profile"
                >
                  <i class="fas fa-user-edit"></i>
                  <span>My Profile</span>
                </a>
                <a data-spa-route="about" class="dropdown-item" href="#about">
                  <i class="fas fa-info-circle"></i>
                  <span>About Developer</span>
                </a>
                <!-- Dark Mode Toggle (moved to dropdown) -->
                <button
                  type="button"
                  class="dropdown-item"
                  id="darkModeToggle"
                  aria-label="Toggle dark mode"
                >
                  <i class="fas fa-moon"></i>
                  <span id="darkModeText">Dark Mode</span>
                </button>
                <button type="button" class="dropdown-item" id="signOutBtn">
                  <i class="fas fa-sign-out-alt"></i>
                  <span>Sign Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content Area - SPA Dynamic Container -->
      <main class="main-content">
        <!-- 🎯 Learning: This area will be dynamically filled by our SPA router. It starts empty. -->
      </main>

      <!-- Tooltip for schedule slots -->
      <div id="slotTooltip" class="slot-tooltip" style="display: none"></div>

      <!-- Modal Structure -->
      <div id="appModal" class="modal-overlay" style="display: none">
        <div class="modal-content glass-card">
          <button
            id="modalCloseBtn"
            class="modal-close-btn"
            type="button"
            aria-label="Close modal"
          >
            <i class="fas fa-times"></i>
          </button>
          <h3 id="modalTitle" class="modal-title">Notification</h3>
          <p id="modalMessage" class="modal-message">
            This is a sample message.
          </p>



          <!-- Edit Time Slot Content (Hidden by default) -->
          <div
            id="editTimeSlotContent"
            class="edit-time-slot-content"
            style="display: none"
          >
            <div class="form-group">
              <label for="newStartTime">New Start Time</label>
              <input type="time" id="newStartTime" class="modal-input" />
            </div>
            <div class="form-group">
              <label for="newEndTime">New End Time</label>
              <input type="time" id="newEndTime" class="modal-input" />
            </div>
          </div>
          <div class="modal-action-buttons">
            <button id="modalConfirmBtn" class="modal-button confirm">
              Confirm
            </button>
            <button id="modalCancelBtn" class="modal-button cancel">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
