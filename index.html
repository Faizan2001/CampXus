<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeetchuThere - Schedule Comparison App" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
       default-src 'self';
       script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.firebase.com https://*.firebaseapp.com https://www.gstatic.com;
       style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://use.fontawesome.com;
       font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://use.fontawesome.com;
       img-src 'self' data: https://*.googleusercontent.com https://api.dicebear.com https://www.google.com;
       connect-src 'self' 
         https://*.firebase.com 
         https://*.firebaseapp.com 
         https://securetoken.googleapis.com 
         https://identitytoolkit.googleapis.com
         https://*.googleapis.com
         https://api.dicebear.com
         wss://*.firebaseio.com;
       frame-src 'none';
       object-src 'none';
       base-uri 'self';
       form-action 'self';
       "
    />
    <title>MeetchuThere</title>

    <!-- Link to main styles -->
    <link href="./css/styles.css" rel="stylesheet" type="text/css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Add Authentication CSS -->
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Firebase Import Map for ES6 Modules -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js",
          "firebase/storage": "https://www.gstatic.com/firebasejs/11.1.0/firebase-storage.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-container">
      <!-- Top Navigation Bar -->
      <nav class="top-nav">
        <div class="nav-left">
          <div class="logo">
            <!-- 🎯 Learning: Make logo clickable to go home in SPA -->
            <span data-spa-route="home" style="cursor: pointer"
              >MeetchuThere</span
            >
          </div>
          <div class="nav-links">
            <!-- 🎯 Learning: Convert to SPA navigation using data-spa-route -->
            <a data-spa-route="home" class="nav-link" href="#home">
              <i class="fas fa-calendar-week"></i>
              <span class="nav-text">Schedule</span>
            </a>
            <a data-spa-route="friends" class="nav-link" href="#friends">
              <i class="fas fa-users"></i>
              <span class="nav-text">Friends</span>
            </a>
          </div>
        </div>

        <div class="nav-right">
          <!-- Login Button (shown when not authenticated) -->
          <button id="login-btn" class="btn btn-primary login-btn">
            🎓 Join CampXus
          </button>

          <!-- User Profile Menu (shown when authenticated) -->
          <div class="user-menu" id="userMenu" style="display: none">
            <button
              type="button"
              class="user-menu-trigger"
              id="userMenuTrigger"
              aria-expanded="false"
              aria-label="User menu"
              title="Open user menu"
            >
              <!-- Default avatar icon (will be replaced with custom avatar) -->
              <div class="user-avatar-trigger" id="userAvatarTrigger">
                <i class="fas fa-user-circle"></i>
              </div>
            </button>

            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-header">
                <div class="user-avatar-large" id="userAvatarLarge">
                  <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                  <strong class="user-name" id="userDropdownName"
                    >John Doe</strong
                  >
                  <span class="user-email" id="userDropdownEmail"
                    >john@university.edu</span
                  >
                </div>
              </div>

              <div class="dropdown-menu">
                <a
                  data-spa-route="profile"
                  class="dropdown-item"
                  id="profileSetupBtn"
                  href="#profile"
                >
                  <i class="fas fa-user-edit"></i>
                  <span>My Profile</span>
                </a>
                <a data-spa-route="about" class="dropdown-item" href="#about">
                  <i class="fas fa-info-circle"></i>
                  <span>About Developer</span>
                </a>
                <!-- Dark Mode Toggle (moved to dropdown) -->
                <button
                  type="button"
                  class="dropdown-item"
                  id="darkModeToggle"
                  aria-label="Toggle dark mode"
                >
                  <i class="fas fa-moon"></i>
                  <span id="darkModeText">Dark Mode</span>
                </button>
                <button type="button" class="dropdown-item" id="signOutBtn">
                  <i class="fas fa-sign-out-alt"></i>
                  <span>Sign Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content Area - SPA Dynamic Container -->
      <main class="main-content">
        <!-- 🎯 Learning: This area will be dynamically filled by our SPA router -->
        <div
          class="spa-loading-placeholder"
          style="text-align: center; padding: 3rem"
        >
          <div style="font-size: 2rem; margin-bottom: 1rem">
            <i class="fas fa-spinner fa-spin"></i>
          </div>
          <h3>Loading CampXus...</h3>
          <p style="color: #666">
            Setting up your schedule management experience
          </p>
        </div>
      </main>

      <!-- Tooltip for schedule slots -->
      <div id="slotTooltip" class="slot-tooltip" style="display: none"></div>

      <!-- Modal Structure -->
      <div id="appModal" class="modal-overlay" style="display: none">
        <div class="modal-content glass-card">
          <h3 id="modalTitle" class="modal-title">Notification</h3>
          <p id="modalMessage" class="modal-message">
            This is a sample message.
          </p>

          <!-- Add User Form Content (Hidden by default) -->
          <div
            id="addUserFormContent"
            class="add-user-form-content"
            style="display: none"
          >
            <div class="form-group">
              <label for="userName">Name</label>
              <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="userName"
                  class="modal-input"
                  placeholder="Enter your name"
                  maxlength="50"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="userId">Student ID</label>
              <div class="input-wrapper">
                <i class="fas fa-id-card"></i>
                <input
                  type="text"
                  id="userId"
                  class="modal-input"
                  placeholder="Enter your student ID"
                  maxlength="20"
                />
              </div>
            </div>
          </div>

          <div
            id="modalActionButtons"
            class="modal-action-buttons"
            style="display: none"
          >
            <button id="modalConfirmBtn" class="modal-button primary-btn">
              Yes
            </button>
            <button id="modalCancelBtn" class="modal-button secondary-btn">
              No
            </button>
          </div>

          <button id="modalCloseBtn" class="modal-close-btn secondary-btn">
            OK
          </button>
        </div>
      </div>
    </div>

    <!-- Load production Firebase configuration -->
    <script src="./js/firebase/config/firebase-config-production.js"></script>
    <!-- Load environment configuration for development -->
    <script src="./js/firebase/config/env-config.js"></script>

    <!-- 🎨 Load Avatar Manager globally for navigation and menu usage -->
    <script type="module" src="./js/core/avatars.js"></script>

    <!-- 📊 Load Data Manager globally for offline support and caching -->
    <script type="module" src="./js/core/data-manager.js"></script>

    <!-- 🎯 Learning: Load SPA Router first, then initialize the app -->
    <script type="module" src="./js/core/spa-router.js"></script>
    <script type="module" src="./js/core/spa-init.js"></script>
    <script type="module" src="./js/core/menu.js"></script>
  </body>
</html>
