<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetchuThere</title>
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <!-- Header Section -->
      <header>
        <h1>MeetchuThere</h1>
      </header>

      <!-- Users Section -->
      <section class="users">
        <!-- Add User Form -->
        <div class="add-user">
          <input
            type="text"
            id="userName"
            placeholder="Enter your name"
            required
          />
          <input
            type="text"
            inputmode="numeric"
            id="userId"
            placeholder="Create a unique ID"
            required
          />
          <!-- Removed onclick -->
          <button type="button">Add User</button>
        </div>

        <!-- Display User List: Populated by JavaScript -->
        <div id="userList" class="user-list">
           <!-- Content generated by renderUserList() -->
        </div>

        <!-- Compare Schedules Button -->
        <!-- Removed onclick -->
        <button type="button" id="compare">
          Compare Schedules
        </button>
      </section>

      <!-- Schedule Section -->
      <section class="schedule">
        <!-- Table ID referenced by JS -->
        <table id="schedule">
          <!-- Table Header (Time/Days) -->
          <thead>
             <tr>
                <th>Day/Time</th>
                <th>8:00-9:30</th>
                <th>9:40-11:10</th>
                <th>11:20-12:50</th>
                <th>1:00-2:30</th>
                <th>2:40-4:10</th>
                <th>4:20-5:50</th>
             </tr>
          </thead>
          <!-- Days (Rows with time slots) - JS interacts with .slot elements -->
          <tbody>
            <tr>
              <td>Sunday</td>
              <td class="slot" data-day="0" data-time="0"></td>
              <td class="slot" data-day="0" data-time="1"></td>
              <td class="slot" data-day="0" data-time="2"></td>
              <td class="slot" data-day="0" data-time="3"></td>
              <td class="slot" data-day="0" data-time="4"></td>
              <td class="slot" data-day="0" data-time="5"></td>
            </tr>
            <tr>
              <td>Monday</td>
              <td class="slot" data-day="1" data-time="0"></td>
              <td class="slot" data-day="1" data-time="1"></td>
              <td class="slot" data-day="1" data-time="2"></td>
              <td class="slot" data-day="1" data-time="3"></td>
              <td class="slot" data-day="1" data-time="4"></td>
              <td class="slot" data-day="1" data-time="5"></td>
            </tr>
            <tr>
              <td>Tuesday</td>
              <td class="slot" data-day="2" data-time="0"></td>
              <td class="slot" data-day="2" data-time="1"></td>
              <td class="slot" data-day="2" data-time="2"></td>
              <td class="slot" data-day="2" data-time="3"></td>
              <td class="slot" data-day="2" data-time="4"></td>
              <td class="slot" data-day="2" data-time="5"></td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td class="slot" data-day="3" data-time="0"></td>
              <td class="slot" data-day="3" data-time="1"></td>
              <td class="slot" data-day="3" data-time="2"></td>
              <td class="slot" data-day="3" data-time="3"></td>
              <td class="slot" data-day="3" data-time="4"></td>
              <td class="slot" data-day="3" data-time="5"></td>
            </tr>
            <tr>
              <td>Thursday</td>
              <td class="slot" data-day="4" data-time="0"></td>
              <td class="slot" data-day="4" data-time="1"></td>
              <td class="slot" data-day="4" data-time="2"></td>
              <td class="slot" data-day="4" data-time="3"></td>
              <td class="slot" data-day="4" data-time="4"></td>
              <td class="slot" data-day="4" data-time="5"></td>
            </tr>
            <tr>
              <td>Friday</td>
              <td class="slot" data-day="5" data-time="0"></td>
              <td class="slot" data-day="5" data-time="1"></td>
              <td class="slot" data-day="5" data-time="2"></td>
              <td class="slot" data-day="5" data-time="3"></td>
              <td class="slot" data-day="5" data-time="4"></td>
              <td class="slot" data-day="5" data-time="5"></td>
            </tr>
            <tr>
              <td>Saturday</td>
              <td class="slot" data-day="6" data-time="0"></td>
              <td class="slot" data-day="6" data-time="1"></td>
              <td class="slot" data-day="6" data-time="2"></td>
              <td class="slot" data-day="6" data-time="3"></td>
              <td class="slot" data-day="6" data-time="4"></td>
              <td class="slot" data-day="6" data-time="5"></td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Export/Import Schedule Section -->
      <div class="export-import">
        <h3>Export Schedule</h3>
        <!-- Removed onclick -->
        <button type="button">Export Current User</button>

        <h3 style="margin-top: 2rem">Import Schedule</h3>
        <!-- ID referenced by JS -->
        <textarea
          id="importText"
          rows="3"
          style="width: 100%"
          placeholder="Paste exported schedule JSON here..."
        ></textarea>
        <!-- Removed onclick -->
        <button
          type="button"
          style="display: block; margin-top: 0.5rem"
        >
          Import User
        </button>
      </div>
    </div>

    <!-- Slot tooltip - ID referenced by JS -->
     <div id="slotTooltip" class="slot-tooltip" style="display: none;"></div>

    <!-- Link to the refactored JavaScript -->
    <script src="js/script.js"></script>
  </body>
</html>
