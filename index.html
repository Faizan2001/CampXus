<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Use viewport-fit=cover to correctly size around iOS safe areas (not used by Android). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Connect with university friends in real-time. Share your schedule, see when classmates are on campus, and never miss a chance to meet up."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://meetchuthere.com/" />

    <!-- Open Graph / Twitter defaults (router updates these per page) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="MeetchuThere - Schedule & Availability"
    />
    <meta
      property="og:description"
      content="Connect with university friends in real-time and meet on campus."
    />
    <meta
      property="og:image"
      content="https://meetchuthere.com/icons/icon-512x512.png?v=2"
    />
    <meta property="og:url" content="https://meetchuthere.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MeetchuThere - Schedule & Availability"
    />
    <meta
      name="twitter:description"
      content="Connect with university friends in real-time and meet on campus."
    />
    <meta
      name="twitter:image"
      content="https://meetchuthere.com/icons/icon-512x512.png?v=2"
    />
    <!-- CSP is set via hosting headers to avoid duplication/conflicts. -->
    <title>MeetchuThere - Schedule & Availability Tracker</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://firestore.googleapis.com"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Main application styles -->
    <link rel="stylesheet" href="/src/css/styles.css" />

    <!-- PWA and Icon Configuration -->
    <!-- Single theme-color meta; we update it early via inline script and keep it synced in app.js -->
    <meta name="theme-color" content="#0A0B0F" />
    <script>
      // Set theme-color ASAP to match saved/app theme before JS bundles load
      (function () {
        try {
          var saved = (localStorage.getItem("theme") || "").toLowerCase();
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved ? saved === "dark" : prefersDark;
          // Match CSS --nav-solid-bg for each theme
          var color = isDark ? "#151820" : "#ffffff";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MeetchuThere" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons (ICO first for crawler heuristics) -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/icons/icon-48x48.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png?v=2"
    />
    <!-- Keep SVG for modern browsers, but place after raster icons (Google Search ignores SVG) -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />

    <!-- Apple Touch Icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png?v=2"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/icons/icon-152x152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/icons/icon-144x144.png"
    />

    <!-- Android/Chrome Icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192x192.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/icons/icon-512x512.png?v=2"
    />

    <!-- JSON-LD: Organization + WebSite (SearchAction) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MeetchuThere",
        "url": "https://meetchuthere.com",
        "logo": "https://meetchuthere.com/icons/icon-512x512.png?v=2"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://meetchuthere.com",
        "name": "MeetchuThere",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://meetchuthere.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <!-- App container is now visible by default again -->
    <div class="app-container">
      <!-- Top Navigation Bar -->
      <nav class="top-nav">
        <div class="nav-left nav-brand">
          <div class="logo">
            <span data-spa-route="home" style="cursor: pointer"
              >MeetchuThere</span
            >
          </div>
        </div>

        <div class="nav-center">
          <div class="nav-links">
            <a data-spa-route="home" class="nav-link" href="#home">
              <i class="fas fa-calendar-week"></i>
              <span class="nav-text">Schedule</span>
            </a>
            <a data-spa-route="friends" class="nav-link" href="#friends">
              <i class="fas fa-user-group"></i>
              <span class="nav-text">Friends</span>
            </a>
            <a
              data-spa-route="notifications"
              class="nav-link"
              href="#notifications"
            >
              <i class="fas fa-bell"></i>
              <span class="nav-text">Notifications</span>
            </a>
          </div>
        </div>

        <div class="nav-right">
          <!-- Notify Friends (mobile+desktop; shows when authenticated) -->
          <button
            id="notifyFriendsBtn"
            class="nav-link nav-cta"
            type="button"
            style="display: none"
            aria-label="Notify friends"
            title="Notify friends"
          >
            <i class="far fa-paper-plane"></i>
            <span class="nav-text">Notify</span>
            <span
              class="nav-dot"
              aria-hidden="true"
              style="display: none"
            ></span>
          </button>
          <!-- Mobile Install PWA button (shown under 480px when eligible) -->
          <button
            id="installPwaBtn"
            class="nav-link nav-cta nav-install"
            type="button"
            style="display: none"
            aria-label="Install app"
            title="Install app"
          >
            <span class="nav-text">Install</span>
          </button>
          <!-- About (visible to all, even when signed out) -->
          <a
            data-spa-route="about"
            class="nav-link nav-cta"
            id="aboutBtn"
            href="#about"
            aria-label="About"
            title="About"
          >
            <span class="nav-text">About</span>
          </a>
          <!-- User Profile Menu (shown when authenticated) -->
          <div class="user-menu" id="userMenu" style="display: none">
            <button
              type="button"
              class="user-menu-trigger"
              id="userMenuTrigger"
              aria-expanded="false"
              aria-label="User menu"
              title="Open user menu"
            >
              <!-- Default avatar icon (will be replaced with custom avatar) -->
              <div class="user-avatar-trigger" id="userAvatarTrigger">
                <i class="fas fa-user-circle"></i>
              </div>
            </button>

            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-header">
                <div class="user-avatar-large" id="userAvatarLarge">
                  <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                  <strong class="user-name" id="userDropdownName"
                    >John Doe</strong
                  >
                  <span class="user-email" id="userDropdownEmail"
                    >john@university.edu</span
                  >
                </div>
              </div>

              <div class="dropdown-menu">
                <a
                  data-spa-route="profile"
                  class="dropdown-item"
                  id="profileSetupBtn"
                  href="#profile"
                >
                  <i class="fas fa-user-edit"></i>
                  <span>My Profile</span>
                </a>
                <a data-spa-route="about" class="dropdown-item" href="#about">
                  <i class="fas fa-info-circle"></i>
                  <span>About Developer</span>
                </a>
                <!-- Dark Mode Toggle (moved to dropdown) -->
                <button
                  type="button"
                  class="dropdown-item"
                  id="darkModeToggle"
                  aria-label="Toggle dark mode"
                >
                  <i class="fas fa-moon"></i>
                  <span id="darkModeText">Dark Mode</span>
                </button>
                <button type="button" class="dropdown-item" id="signOutBtn">
                  <i class="fas fa-sign-out-alt"></i>
                  <span>Sign Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main Content Area - SPA Dynamic Container -->
      <main class="main-content">
        <!-- 🎯 Learning: This area will be dynamically filled by our SPA router. It starts empty. -->
      </main>

      <!-- Tooltip for schedule slots -->
      <div id="slotTooltip" class="slot-tooltip" style="display: none"></div>

      <!-- Modal Structure -->
      <div id="appModal" class="modal-overlay" style="display: none">
        <div class="modal-content glass-card">
          <button
            id="modalCloseBtn"
            class="modal-close-btn"
            type="button"
            aria-label="Close modal"
          >
            <i class="fas fa-times"></i>
          </button>
          <h3 id="modalTitle" class="modal-title">Notification</h3>
          <p id="modalMessage" class="modal-message">
            This is a sample message.
          </p>

          <!-- Edit Time Range Content (Hidden by default) -->
          <div
            id="editTimeSlotContent"
            class="edit-time-slot-content"
            style="display: none"
          >
            <div class="form-group">
              <label for="newStartTime">New Start Time</label>
              <input type="time" id="newStartTime" class="modal-input" />
            </div>
            <div class="form-group">
              <label for="newEndTime">New End Time</label>
              <input type="time" id="newEndTime" class="modal-input" />
            </div>
          </div>
          <div class="modal-action-buttons">
            <button id="modalConfirmBtn" class="modal-button confirm">
              Confirm
            </button>
            <button id="modalCancelBtn" class="modal-button cancel">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav
      class="mobile-bottom-nav"
      role="navigation"
      aria-label="Primary mobile"
    >
      <a
        data-spa-route="home"
        href="#home"
        class="mobile-nav-item"
        aria-label="Schedule"
        aria-current="false"
      >
        <i class="fas fa-calendar-week"></i>
        <span class="mobile-nav-label">Schedule</span>
      </a>
      <a
        data-spa-route="friends"
        href="#friends"
        class="mobile-nav-item"
        aria-label="Friends"
        aria-current="false"
      >
        <i class="fas fa-user-group"></i>
        <span class="mobile-nav-label">Friends</span>
      </a>
      <a
        data-spa-route="notifications"
        href="#notifications"
        class="mobile-nav-item"
        aria-label="Notifications"
        aria-current="false"
      >
        <i class="fas fa-bell"></i>
        <span class="mobile-nav-label">Notifications</span>
        <span
          class="mobile-nav-badge"
          aria-label="Unread notifications"
          aria-live="polite"
        ></span>
      </a>
      <button
        class="mobile-nav-item mobile-profile-trigger"
        id="mobileProfileTrigger"
        aria-label="User menu"
        aria-expanded="false"
        type="button"
      >
        <div class="mobile-user-avatar" id="mobileUserAvatar">
          <i class="fas fa-user-circle"></i>
        </div>
      </button>
    </nav>

    <!-- Mobile Profile Sheet & Scrim (for bottom sheet menu) -->
    <div id="mobileProfileScrim" class="mobile-profile-scrim" hidden></div>
    <aside
      id="mobileProfileSheet"
      class="mobile-profile-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mobileSheetName"
      hidden
    >
      <div class="mobile-sheet-grabber" aria-hidden="true"></div>
      <header class="mobile-sheet-header">
        <div class="mobile-sheet-avatar" id="mobileSheetAvatar">
          <i class="fas fa-user-circle"></i>
        </div>
        <div class="user-details">
          <strong class="user-name" id="mobileSheetName">User</strong>
          <span class="user-email" id="mobileSheetEmail"></span>
        </div>
      </header>
      <nav
        class="mobile-sheet-menu"
        role="menu"
        aria-labelledby="mobileProfileTitle"
      >
        <a
          role="menuitem"
          data-spa-route="profile"
          href="#profile"
          class="mobile-sheet-row"
          id="mobileSheetProfileLink"
        >
          <i class="fas fa-user-edit"></i><span>My Profile</span>
        </a>
        <a
          role="menuitem"
          data-spa-route="about"
          href="#about"
          class="mobile-sheet-row"
          id="mobileSheetAboutLink"
        >
          <i class="fas fa-info-circle"></i><span>About Developer</span>
        </a>
        <button
          role="menuitem"
          type="button"
          class="mobile-sheet-row"
          id="mobileSheetDarkModeToggle"
          aria-pressed="false"
        >
          <i class="fas fa-moon"></i
          ><span id="mobileSheetDarkModeText">Dark Mode</span>
        </button>
        <button
          role="menuitem"
          type="button"
          class="mobile-sheet-row danger"
          id="mobileSheetSignOutBtn"
        >
          <i class="fas fa-sign-out-alt"></i><span>Sign Out</span>
        </button>
      </nav>
    </aside>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
