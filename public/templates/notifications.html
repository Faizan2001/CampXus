<!--
  Notifications template
  - Layout is provided by template; JS updates only the list to avoid flicker.
-->

<div class="content-grid">
  <div class="notifications-page">
    <div id="pushPermissionBanner" class="push-permission-banner-host" aria-live="polite"></div>

    <section class="glass-card notifications-card">
      <div class="notifications-card-header">
        <h1 class="page-title">
          <i class="fas fa-bell"></i>
          Notifications
        </h1>
        <div class="header-actions">
          <button type="button" class="mark-all-read button secondary" disabled>
            <i class="fas fa-check-double"></i>
            Mark All Seen
          </button>
        </div>
      </div>

      <div class="notifications-filters">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-list"></i>
          All
        </button>
        <button class="filter-btn" data-filter="friend">
          <i class="fas fa-user-plus"></i>
          Friend Requests
        </button>
        <button class="filter-btn" data-filter="location">
          <i class="fas fa-map-marker-alt"></i>
          Location Requests
        </button>
        <button class="filter-btn" data-filter="club">
          <i class="fas fa-flag"></i>
          Clubs
        </button>
      </div>

      <div id="notificationsList" class="notifications-scrollable-container">
        <div class="empty-state" id="notificationsEmpty">
          <h4>All caught up!</h4>
          <p>
            No new notifications right now. When friends send you requests or share their location,
            you'll see them here.
          </p>
          <div class="empty-actions">
            <button type="button" class="button secondary" data-spa-route="friends">
              <i class="fas fa-users"></i>
              Find Friends
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
