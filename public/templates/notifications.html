<!-- 
  🎯 Learning: This is the NOTIFICATIONS template - your campus social hub!
  This handles location sharing requests, friend notifications, and other campus presence updates.
  
  Notice how we follow the same structure as other templates:
  - .content-grid container for consistent layout
  - glass-card sections for modern styling
  - page-title-section with icon and subtitle
  - Scrollable containers for dynamic content
  - Empty states with helpful messaging
-->

<div class="content-grid">
  <div class="notifications-page">
    <section class="glass-card notifications-card">
      <div class="notifications-card-header">
        <h1 class="page-title">
          <i class="fas fa-bell"></i>
          Notifications
        </h1>
        <div class="header-actions">
          <button type="button" class="mark-all-read button secondary" disabled>
            <i class="fas fa-check-double"></i>
            Mark All Seen
          </button>
        </div>
      </div>
      <div id="notificationsList" class="notifications-scrollable-container">
        <!-- This will be populated by JavaScript -->
        <div class="empty-state" id="notificationsEmpty">
          <h4>All caught up!</h4>
          <p>
            No new notifications right now. When friends send you requests or share their location,
            you'll see them here.
          </p>
          <div class="empty-actions">
            <button type="button" class="button secondary" data-spa-route="friends">
              <i class="fas fa-users"></i>
              Find Friends
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
