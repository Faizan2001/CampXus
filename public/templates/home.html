<!-- 
  🎯 Learning: This is the HOME template - your main schedule interface!
  This contains all the content that was originally in the main-content area
  of your index.html file.
  
  By separating it into a template, we can load it dynamically in our SPA!
-->

<!-- Single Column Layout -->
<div class="content-grid">
  <!-- Horizontal Friends Bar - Instagram-style at page top -->
  <section class="horizontal-friends-section">
    <div
      id="gps-permission-banner"
      class="gps-permission-banner"
      data-component="location-permission-banner"
      aria-hidden="true"
    >
      <span class="gps-banner-text">
        Share live campus presence
      </span>
      <div class="gps-banner-actions">
        <button
          type="button"
          class="gps-banner-action"
          data-action="enable-gps"
        >
          Enable
        </button>
        <button
          type="button"
          class="gps-banner-dismiss"
          data-action="dismiss-gps"
          aria-label="Dismiss location permission banner"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>
    <div id="horizontal-friends-container" class="horizontal-friends-wrapper">
      <!-- HorizontalFriendsBar component will be initialized here -->
    </div>
  </section>

  <!-- Schedule Column (Centered) -->
  <div class="schedule-column">
    <section class="glass-card schedule-section">
      <div class="schedule-header">
        <h3>
          <span id="schedule-heading-text" aria-live="polite" aria-atomic="true" aria-label="Schedule">Schedule</span>
        </h3>
        <div class="schedule-header-actions">
          <!-- Header Compare Action (replaces friends-bar compare button) -->
          <button
            id="compareActionBtn"
            class="control-btn compare-action-btn"
            title="Compare schedule"
            aria-label="Compare schedule"
            style="display:none"
          >
            <i class="fas fa-balance-scale" aria-hidden="true"></i>
            <span class="btn-text">Compare schedule</span>
            <span class="btn-text-mobile">Compare</span>
          </button>

          <!-- Mobile Controls Toggle -->
          <button
            id="scheduleControlsToggle"
            class="schedule-controls-toggle"
            title="Schedule Options"
            aria-label="Toggle schedule controls"
            aria-expanded="false"
          >
            <span class="toggle-icon-wrapper" aria-hidden="true">
              <!-- Closed state icon (chevron down) -->
              <svg
                class="icon-state icon-closed"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              <!-- Open state icon (chevron up) -->
              <svg
                class="icon-state icon-open"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="18 15 12 9 6 15"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </div>

      <!-- Unified Schedule Controls -->
      <div class="schedule-controls-bar" id="scheduleControlsBar">
        <div class="view-mode-toggle">
          <button
            class="control-btn view-mode-btn active"
            id="dayViewBtn"
            data-view="day"
          >
            <i class="fas fa-list"></i>
            <span class="btn-text">Day View</span>
            <span class="btn-text-mobile">Day</span>
          </button>
          <button
            class="control-btn view-mode-btn"
            id="gridViewBtn"
            data-view="grid"
          >
            <i class="fas fa-th"></i>
            <span class="btn-text">Grid View</span>
            <span class="btn-text-mobile">Grid</span>
          </button>
        </div>

        <div class="schedule-actions-group">
          <button
            id="addNewTimeSlotBtn"
            class="control-btn add-slot-btn"
            title="Add new time slot"
          >
            <i class="fas fa-plus"></i>
            <span class="btn-text">Add Slot</span>
            <span class="btn-text-mobile">Row</span>
          </button>

          <button
            id="togglePinModeBtn"
            class="control-btn pin-btn"
            title="Toggle Pin Mode"
            disabled
          >
            <i class="fas fa-thumbtack"></i>
            <span class="btn-text">Pin</span>
          </button>
        </div>
      </div>

      <!-- Day Selector Bar (shows only in day view mode) -->
      <div class="day-selector-container" id="daySelectorContainer">
        <div class="day-selector" id="daySelector">
          <button class="day-btn" data-day="0" id="dayBtn0">
            <span class="day-abbreviation">Su</span>
            <span class="day-date">1</span>
          </button>
          <button class="day-btn" data-day="1" id="dayBtn1">
            <span class="day-abbreviation">M</span>
            <span class="day-date">2</span>
          </button>
          <button class="day-btn" data-day="2" id="dayBtn2">
            <span class="day-abbreviation">Tu</span>
            <span class="day-date">3</span>
          </button>
          <button class="day-btn" data-day="3" id="dayBtn3">
            <span class="day-abbreviation">W</span>
            <span class="day-date">4</span>
          </button>
          <button class="day-btn" data-day="4" id="dayBtn4">
            <span class="day-abbreviation">Th</span>
            <span class="day-date">5</span>
          </button>
          <button class="day-btn" data-day="5" id="dayBtn5">
            <span class="day-abbreviation">F</span>
            <span class="day-date">6</span>
          </button>
          <button class="day-btn" data-day="6" id="dayBtn6">
            <span class="day-abbreviation">Sa</span>
            <span class="day-date">7</span>
          </button>
        </div>
      </div>

      <!-- Day View Container (Mobile-First) -->
      <div class="schedule-day-view active" id="scheduleDayView">
        <div class="day-view-container" id="dayViewContainer">
          <!-- Day view time slots will be generated here -->
          <!-- Placeholder rows: replaced when renderDayView() clears the container -->
          <div class="day-slot-placeholder" aria-hidden="true"></div>
          <div class="day-slot-placeholder" aria-hidden="true"></div>
          <div class="day-slot-placeholder" aria-hidden="true"></div>
          <div class="day-slot-placeholder" aria-hidden="true"></div>
          <div class="day-slot-placeholder" aria-hidden="true"></div>
          <div class="day-slot-placeholder" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Grid View Container (Traditional view) -->
      <div class="schedule-grid-view" id="scheduleGridView">
        <div class="schedule-wrapper">
          <table id="scheduleTable" class="schedule-table">
            <thead>
              <tr>
                <th class="time-header">Time</th>
                <th class="day-header" data-day="0">Su</th>
                <th class="day-header" data-day="1">M</th>
                <th class="day-header" data-day="2">Tu</th>
                <th class="day-header" data-day="3">W</th>
                <th class="day-header" data-day="4">Th</th>
                <th class="day-header" data-day="5">F</th>
                <th class="day-header" data-day="6">Sa</th>
              </tr>
            </thead>
            <tbody>
              <!-- Rows will be generated dynamically by JavaScript -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Add New Row Button moved to controls bar above -->
    </section>
  </div>
</div>

<!-- 
  🎯 Learning Note: Notice how this template contains ONLY the content that goes 
  inside main-content. The navigation, modals, and other shared elements stay 
  in the main index.html file.
  
  This is a key SPA concept: separate shared layout from page-specific content!
-->
