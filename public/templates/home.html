<!-- 
  🎯 Learning: This is the HOME template - your main schedule interface!
  This contains all the content that was originally in the main-content area
  of your index.html file.
  
  By separating it into a template, we can load it dynamically in our SPA!
-->

<!-- Horizontal Friends Bar - Instagram-style at page top -->
<section class="horizontal-friends-section">
  <div id="horizontal-friends-container" class="horizontal-friends-wrapper">
    <!-- HorizontalFriendsBar component will be initialized here -->
  </div>
</section>

<!-- Responsive Layout: Two-column (Desktop), Single column (Mobile) -->
<div class="content-grid">
  <!-- Controls Column (Left on Desktop, Below friends bar on Mobile) -->
  <div class="controls-column">
    <!-- Compare Section (Desktop only - Mobile has compare in horizontal bar) -->
    <section class="glass-card compare-section desktop-only">
      <h3>
        <i class="fas fa-layer-group"></i>
        Compare Schedules
      </h3>
      <div class="button-group">
        <button type="button" id="compare" class="primary-btn">
          <i class="fas fa-balance-scale"></i>
          Compare Schedules
        </button>
      </div>
    </section>

    <!-- Import/Export Section (Now fourth) -->
    <section class="glass-card import-export-section">
      <h3>
        <i class="fas fa-exchange-alt"></i>
        Import / Export
      </h3>
      <div class="export-section">
        <h4>Export Schedule</h4>
        <button type="button" class="secondary-btn full-width">
          <i class="fas fa-upload"></i>
          Export Current User
        </button>
      </div>
      <div class="import-section">
        <h4>Import Schedule</h4>
        <div class="input-wrapper">
          <textarea
            id="importText"
            placeholder="Paste exported schedule JSON here..."
          ></textarea>
          <i class="fas fa-download"></i>
        </div>
        <button type="button" class="secondary-btn full-width">
          <i class="fas fa-download"></i>
          Import User
        </button>
      </div>
    </section>
  </div>

  <!-- Schedule Column (Right on Desktop, Bottom on Mobile) -->
  <div class="schedule-column">
    <section class="glass-card schedule-section">
      <div class="schedule-header">
        <h3>
          <i class="fas fa-calendar-week"></i>
          Weekly Schedule
          <span
            id="schedule-owner-indicator"
            class="schedule-owner-indicator"
            style="display: none"
          >
            <i class="fas fa-user-friends"></i>
            <span class="owner-name"></span>
          </span>
        </h3>
        <div class="schedule-header-actions">
          <button
            id="togglePinModeBtn"
            class="pin-btn"
            title="Toggle Pin Mode"
            disabled
          >
            <i class="fas fa-thumbtack"></i>
            <span class="pin-btn-text">Pin</span>
          </button>
          <button
            type="button"
            id="addUserHeaderBtn"
            class="add-user-header-btn"
            title="Add New User"
          >
            <i class="fas fa-plus"></i>
            <i class="fas fa-users"></i>
          </button>
        </div>
      </div>

      <!-- New Mobile-First View Controls -->
      <div class="schedule-view-controls">
        <div class="view-mode-toggle">
          <button class="view-mode-btn active" id="dayViewBtn" data-view="day">
            <i class="fas fa-list"></i>
            Day View
          </button>
          <button class="view-mode-btn" id="gridViewBtn" data-view="grid">
            <i class="fas fa-th"></i>
            Grid View
          </button>
        </div>
      </div>

      <!-- Day Selector Bar (shows only in day view mode) -->
      <div class="day-selector-container" id="daySelectorContainer">
        <div class="day-selector" id="daySelector">
          <button class="day-btn" data-day="0" id="dayBtn0">
            <span class="day-abbreviation">Su</span>
            <span class="day-date">1</span>
          </button>
          <button class="day-btn" data-day="1" id="dayBtn1">
            <span class="day-abbreviation">M</span>
            <span class="day-date">2</span>
          </button>
          <button class="day-btn" data-day="2" id="dayBtn2">
            <span class="day-abbreviation">Tu</span>
            <span class="day-date">3</span>
          </button>
          <button class="day-btn" data-day="3" id="dayBtn3">
            <span class="day-abbreviation">W</span>
            <span class="day-date">4</span>
          </button>
          <button class="day-btn" data-day="4" id="dayBtn4">
            <span class="day-abbreviation">Th</span>
            <span class="day-date">5</span>
          </button>
          <button class="day-btn" data-day="5" id="dayBtn5">
            <span class="day-abbreviation">F</span>
            <span class="day-date">6</span>
          </button>
          <button class="day-btn" data-day="6" id="dayBtn6">
            <span class="day-abbreviation">Sa</span>
            <span class="day-date">7</span>
          </button>
        </div>
      </div>

      <!-- Day View Container (Mobile-First) -->
      <div class="schedule-day-view active" id="scheduleDayView">
        <div class="day-view-container" id="dayViewContainer">
          <!-- Day view time slots will be generated here -->
        </div>
      </div>

      <!-- Grid View Container (Traditional view) -->
      <div class="schedule-grid-view" id="scheduleGridView">
        <div class="schedule-wrapper">
          <table id="scheduleTable" class="schedule-table">
            <thead>
              <tr>
                <th class="time-header">Time</th>
                <th class="day-header" data-day="0">S</th>
                <th class="day-header" data-day="1">M</th>
                <th class="day-header" data-day="2">T</th>
                <th class="day-header" data-day="3">W</th>
                <th class="day-header" data-day="4">T</th>
                <th class="day-header" data-day="5">F</th>
                <th class="day-header" data-day="6">S</th>
                <th id="addTimeSlotHeaderCell">
                  <button
                    type="button"
                    id="addNewTimeSlotBtn"
                    class="add-timeslot-btn"
                    title="Add new time slot"
                  >
                    <i class="fas fa-plus"></i>
                  </button>
                </th>
              </tr>
            </thead>
            <tbody>
              <!-- Rows will be generated dynamically by JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- 
  🎯 Learning Note: Notice how this template contains ONLY the content that goes 
  inside main-content. The navigation, modals, and other shared elements stay 
  in the main index.html file.
  
  This is a key SPA concept: separate shared layout from page-specific content!
-->
