<!-- 
  🎯 Learning: This is the HOME template - your main schedule interface!
  This contains all the content that was originally in the main-content area
  of your index.html file.
  
  By separating it into a template, we can load it dynamically in our SPA!
-->

<!-- Horizontal Friends Bar - Instagram-style at page top -->
<section class="horizontal-friends-section">
  <div id="horizontal-friends-container" class="horizontal-friends-wrapper">
    <!-- HorizontalFriendsBar component will be initialized here -->
  </div>
</section>

<!-- Responsive Layout: Two-column (Desktop), Single column (Mobile) -->
<div class="content-grid">
  <!-- Controls Column (Left on Desktop, Below friends bar on Mobile) -->
  <div class="controls-column">
    <!-- Compare Section (Desktop only - Mobile has compare in horizontal bar) -->
    <section class="glass-card compare-section desktop-only">
      <h3>
        <i class="fas fa-layer-group"></i>
        Compare Schedules
      </h3>
      <div class="button-group">
        <button type="button" id="compare" class="primary-btn">
          <i class="fas fa-balance-scale"></i>
          Compare Schedules
        </button>
      </div>
    </section>

    <!-- Import/Export Section (Now fourth) -->
    <section class="glass-card import-export-section">
      <h3>
        <i class="fas fa-exchange-alt"></i>
        Import / Export
      </h3>
      <div class="export-section">
        <h4>Export Schedule</h4>
        <button type="button" class="secondary-btn full-width">
          <i class="fas fa-upload"></i>
          Export Current User
        </button>
      </div>
      <div class="import-section">
        <h4>Import Schedule</h4>
        <div class="input-wrapper">
          <textarea
            id="importText"
            placeholder="Paste exported schedule JSON here..."
          ></textarea>
          <i class="fas fa-download"></i>
        </div>
        <button type="button" class="secondary-btn full-width">
          <i class="fas fa-download"></i>
          Import User
        </button>
      </div>
    </section>
  </div>

  <!-- Schedule Column (Right on Desktop, Bottom on Mobile) -->
  <div class="schedule-column">
    <section class="glass-card schedule-section">
      <div class="schedule-header">
        <h3>
          <i class="fas fa-calendar-week"></i>
          Weekly Schedule
        </h3>
        <div class="schedule-header-actions">
          <button
            id="togglePinModeBtn"
            class="pin-btn"
            title="Toggle Pin Mode"
            disabled
          >
            <i class="fas fa-thumbtack"></i>
            <span class="pin-btn-text">Pin</span>
          </button>
          <button
            type="button"
            id="addUserHeaderBtn"
            class="add-user-header-btn"
            title="Add New User"
          >
            <i class="fas fa-plus"></i>
            <i class="fas fa-users"></i>
          </button>
        </div>
      </div>
      <div class="schedule-wrapper">
        <table id="scheduleTable" class="schedule-table">
          <thead>
            <tr>
              <th>Day/Time</th>
              <th>8:00-9:30</th>
              <th>9:40-11:10</th>
              <th>11:20-12:50</th>
              <th>1:00-2:30</th>
              <th>2:40-4:10</th>
              <th>4:20-5:50</th>
              <th id="addTimeSlotHeaderCell">
                <button
                  type="button"
                  id="addNewTimeSlotBtn"
                  class="add-timeslot-btn"
                  title="Add new time slot"
                >
                  <i class="fas fa-plus"></i>
                </button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="day-label">Sunday</td>
              <td class="slot" data-day="0" data-time="0"></td>
              <td class="slot" data-day="0" data-time="1"></td>
              <td class="slot" data-day="0" data-time="2"></td>
              <td class="slot" data-day="0" data-time="3"></td>
              <td class="slot" data-day="0" data-time="4"></td>
              <td class="slot" data-day="0" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Monday</td>
              <td class="slot" data-day="1" data-time="0"></td>
              <td class="slot" data-day="1" data-time="1"></td>
              <td class="slot" data-day="1" data-time="2"></td>
              <td class="slot" data-day="1" data-time="3"></td>
              <td class="slot" data-day="1" data-time="4"></td>
              <td class="slot" data-day="1" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Tuesday</td>
              <td class="slot" data-day="2" data-time="0"></td>
              <td class="slot" data-day="2" data-time="1"></td>
              <td class="slot" data-day="2" data-time="2"></td>
              <td class="slot" data-day="2" data-time="3"></td>
              <td class="slot" data-day="2" data-time="4"></td>
              <td class="slot" data-day="2" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Wednesday</td>
              <td class="slot" data-day="3" data-time="0"></td>
              <td class="slot" data-day="3" data-time="1"></td>
              <td class="slot" data-day="3" data-time="2"></td>
              <td class="slot" data-day="3" data-time="3"></td>
              <td class="slot" data-day="3" data-time="4"></td>
              <td class="slot" data-day="3" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Thursday</td>
              <td class="slot" data-day="4" data-time="0"></td>
              <td class="slot" data-day="4" data-time="1"></td>
              <td class="slot" data-day="4" data-time="2"></td>
              <td class="slot" data-day="4" data-time="3"></td>
              <td class="slot" data-day="4" data-time="4"></td>
              <td class="slot" data-day="4" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Friday</td>
              <td class="slot" data-day="5" data-time="0"></td>
              <td class="slot" data-day="5" data-time="1"></td>
              <td class="slot" data-day="5" data-time="2"></td>
              <td class="slot" data-day="5" data-time="3"></td>
              <td class="slot" data-day="5" data-time="4"></td>
              <td class="slot" data-day="5" data-time="5"></td>
            </tr>
            <tr>
              <td class="day-label">Saturday</td>
              <td class="slot" data-day="6" data-time="0"></td>
              <td class="slot" data-day="6" data-time="1"></td>
              <td class="slot" data-day="6" data-time="2"></td>
              <td class="slot" data-day="6" data-time="3"></td>
              <td class="slot" data-day="6" data-time="4"></td>
              <td class="slot" data-day="6" data-time="5"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<!-- 
  🎯 Learning Note: Notice how this template contains ONLY the content that goes 
  inside main-content. The navigation, modals, and other shared elements stay 
  in the main index.html file.
  
  This is a key SPA concept: separate shared layout from page-specific content!
-->
