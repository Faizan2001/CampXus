<!--  This is the FRIENDS template - where users manage their connections! -->

<div class="content-grid">
  <div class="friends-container">
    <!-- Search and Add Friends - Primary Action First -->
    <section class="glass-card friends-search">
      <h3>
        <i class="fas fa-search"></i>
        Find Friends
      </h3>
      <div class="search-input-wrapper">
        <input
          type="text"
          id="friendSearch"
          class="search-input"
          placeholder="Search by handle @friend or exact ID"
        />
        <button type="button" class="search-btn">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </section>

    <!-- Friends List - Main Content -->
    <section class="glass-card friends-list">
      <h3>
        <i class="fas fa-heart"></i>
        Your Friends
      </h3>
      <div id="friendsList" class="friends-scrollable-container">
        <!-- This will be populated by JavaScript -->
        <div class="empty-state">
          <div class="empty-icon">👥</div>
          <h4>No friends yet!</h4>
          <p>
            Start connecting with your classmates to see shared study times and
            plan group sessions.
          </p>
        </div>
      </div>
    </section>

    <!-- Campus Presence Header -->
    <section class="glass-card campus-presence-header">
      <div class="page-title-section">
        <h1 class="page-title">
          <i class="fas fa-map-marker-alt"></i>
          Campus Presence
        </h1>
        
        <!-- Location Sharing Toggle - Inline Layout -->
        <div class="campus-presence-controls">
          <span class="presence-label">Share campus location with friends</span>
          <div class="header-location-toggle-container">
            <!-- This will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </section>

    <!-- Friend Requests moved to Notifications page -->

    <!-- Privacy note: Individual privacy controls are now available via the three-dots menu on each friend card -->
  </div>
</div>

<!-- 
  🎯 Learning Note: This template shows how you can structure future pages.
  You can add CSS files and JavaScript files to the router configuration
  when you're ready to implement the full friends functionality!
-->
