<div
  class="notify-overlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="notifyOverlayTitle"
>
  <div class="notify-backdrop" data-close-overlay></div>
  <div class="notify-container" id="notifyContainer">
    <div class="notify-grabber" aria-hidden="true"></div>
    <header class="notify-header">
      <h2 id="notifyOverlayTitle" class="notify-title">
        <i class="fas fa-paper-plane"></i>
        Notify Friends
      </h2>
      <button
        type="button"
        class="notify-close"
        id="notifyCloseBtn"
        aria-label="Close"
      >
        <i class="fas fa-times"></i>
      </button>
    </header>

    <section class="notify-segment">
      <div class="segment-header sticky">
        <h3 class="segment-title">Starred Friends</h3>
        <div class="segment-actions">
          <label class="select-all">
            <input type="checkbox" id="notifySelectAll" />
            <span>Select all</span>
          </label>
        </div>
      </div>
      <div id="notifyStarredGrid" class="friends-grid" aria-live="polite"></div>
      <div id="notifyStarredEmpty" class="segment-empty" hidden>
        <p>Star friends first</p>
        <a data-spa-route="friends" href="#friends" class="button secondary"
          >Go to Friends</a
        >
      </div>
    </section>

    <!-- Sticky send button right after starred friends -->
    <div class="notify-send-button">
      <button id="notifySendBtn" class="send-button" disabled>
        <i class="fas fa-paper-plane"></i>
        <span>Send Notification</span>
      </button>
    </div>

    <!-- Response sections below (read-only, informational) -->
    <section class="notify-segment notify-responses">
      <div class="segment-header">
        <h3 class="segment-title">Available</h3>
      </div>
      <div
        id="notifyAvailableGrid"
        class="friends-grid"
        aria-live="polite"
      ></div>
      <div id="notifyAvailableEmpty" class="segment-empty">
        <p>No responses yet</p>
      </div>
    </section>

    <section class="notify-segment notify-responses">
      <div class="segment-header">
        <h3 class="segment-title">Busy</h3>
      </div>
      <div id="notifyBusyGrid" class="friends-grid" aria-live="polite"></div>
      <div id="notifyBusyEmpty" class="segment-empty">
        <p>No responses yet</p>
      </div>
    </section>
  </div>
</div>
