<section class="group-detail">
  <div class="group-header">
    <h1 id="group-title">Class Space</h1>
    <div id="group-sub"></div>
  </div>
  <div class="group-tabs">
    <button id="tab-chat" class="tab active">Chat</button>
    <button id="tab-members" class="tab">Members</button>
  </div>
  <div id="group-chat" class="group-tab-content">
    <button id="loadOlderBtn" class="load-older-btn hidden">Load Older Messages</button>
    <div id="messages" class="messages"></div>
    <div class="message-input">
      <input id="messageText" type="text" placeholder="Type a message..." maxlength="500" />
      <button id="sendMessageBtn">Send</button>
    </div>
  </div>
  <div id="group-members" class="group-tab-content hidden">
    <div id="membersList" class="members-list"></div>
  </div>
</section>
