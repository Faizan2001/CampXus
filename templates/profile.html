<!-- 
  🎯 Learning: This is the PROFILE template - your profile setup interface!
  This contains the profile setup form that was originally in pages/profile-setup.html
  
  Notice how we only include the content that goes inside main-content.
  The navigation and other shared elements stay in the main index.html.
-->

<div class="content-grid">
  <!-- Profile Setup Card - using glass-card for consistent styling -->
  <div class="profile-setup-card glass-card">
    <div class="setup-header">
      <div class="setup-title-section">
        <h1 class="setup-title">Welcome to CampXus! 👋</h1>
        <p class="setup-subtitle">
          Let's get your profile set up in just 2 quick steps.
        </p>
      </div>
      <div class="setup-progress-container">
        <div class="setup-step-info">
          <span class="current-step">Step 1</span> of
          <span class="total-steps">2</span>
        </div>
        <div class="setup-progress">
          <div class="step-block active" data-step="0"></div>
          <div class="step-block" data-step="1"></div>
        </div>
      </div>
    </div>

    <div class="setup-body">
      <!-- Step 0: Basic Information -->
      <div class="setup-step active" data-step="0">
        <div class="step-header">
          <span class="step-icon">🧑‍🎓</span>
          <h2 class="step-title">Basic Information</h2>
          <p class="step-description">
            Tell us a bit about yourself to get started.
          </p>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="setup-first-name">First Name</label>
            <input
              type="text"
              id="setup-first-name"
              name="setup-first-name"
              class="form-input"
              placeholder="e.g., Jane"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="setup-last-name">Last Name</label>
            <input
              type="text"
              id="setup-last-name"
              name="setup-last-name"
              class="form-input"
              placeholder="e.g., Doe"
              required
            />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="setup-email">University Email</label>
          <input
            type="email"
            id="setup-email"
            name="setup-email"
            class="form-input"
            placeholder="Your university email"
            readonly
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="setup-student-id">Student ID</label>
          <input
            type="text"
            id="setup-student-id"
            name="setup-student-id"
            class="form-input"
            placeholder="Your student ID"
            readonly
          />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="setup-starting-year"
              >Starting Year</label
            >
            <select
              id="setup-starting-year"
              name="setup-starting-year"
              class="form-input"
              required
            >
              <option value="" disabled selected>Select year</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
              <option value="2022">2022</option>
              <option value="2021">2021</option>
              <option value="2020">2020</option>
              <option value="2019">2019</option>
              <option value="2018">2018</option>
              <!-- Add more years as needed -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="setup-major">Major/Department</label>
            <input
              type="text"
              id="setup-major"
              name="setup-major"
              class="form-input"
              placeholder="e.g., Computer Science"
              required
            />
          </div>
        </div>
      </div>

      <!-- Step 1: Profile Picture & Bio -->
      <div class="setup-step" data-step="1">
        <div class="step-header">
          <span class="step-icon">📸</span>
          <h2 class="step-title">Profile Picture & Bio</h2>
          <p class="step-description">
            Add a photo and a short bio to personalize your profile (optional).
          </p>
        </div>
        <div class="profile-picture-section">
          <label
            for="profile-picture-upload"
            class="profile-picture-preview-label"
          >
            <div
              id="profile-picture-preview"
              class="profile-picture-preview"
              title="Click to upload a profile picture"
            >
              👤
            </div>
          </label>
          <input
            type="file"
            id="profile-picture-upload"
            name="profile-picture-upload"
            class="profile-picture-upload"
            accept="image/jpeg, image/png"
          />
          <button
            type="button"
            class="button secondary"
            onclick="document.getElementById('profile-picture-upload').click();"
          >
            <i class="fas fa-upload"></i> Choose Image
          </button>
          <p class="form-hint" style="margin-top: 0.5rem">
            Max 5MB. JPG or PNG only.
          </p>
        </div>

        <div class="form-group">
          <label class="form-label" for="setup-bio">Bio (Optional)</label>
          <textarea
            id="setup-bio"
            name="setup-bio"
            class="form-input"
            rows="3"
            maxlength="200"
            placeholder="Tell us something about yourself..."
          ></textarea>
          <div class="char-counter-container">
            <span id="bio-count">0</span>/200
          </div>
        </div>
      </div>
    </div>

    <div class="setup-navigation">
      <button
        type="button"
        class="button secondary setup-nav-button"
        id="setup-prev-btn"
        style="display: none"
      >
        <i class="fas fa-arrow-left"></i> Previous
      </button>
      <div style="display: flex; gap: 1rem; align-items: center">
        <button
          type="button"
          class="button muted setup-nav-button"
          id="setup-skip-btn"
        >
          Skip for now
        </button>
        <button
          type="button"
          class="button btn-primary setup-nav-button"
          id="setup-next-btn"
        >
          Next Step <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 
  🎯 Learning Note: This template will use the profile-setup.css file and 
  profile-setup.js file when loaded by our SPA router. The router handles
  loading the right CSS and JavaScript for each page automatically!
-->
