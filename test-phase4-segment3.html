<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase 4 Segment 3 Test - Advanced Validation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .test-result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .pass {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .fail {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .test-group {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .test-section {
        border-left: 4px solid #007bff;
        padding-left: 15px;
        margin: 20px 0;
      }
      .validation-result {
        background: #f8f9fa;
        padding: 10px;
        margin: 5px 0;
        border-radius: 3px;
        font-family: monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Phase 4 Segment 3: Advanced Time Slot Validation Test</h1>

    <div id="test-results"></div>

    <script type="module">
      import {
        validateTimeSlotAdvanced,
        validateTimeSlotsBatch,
      } from "./js/timeUtils.js";

      function runTest(description, testFn) {
        try {
          const result = testFn();
          const div = document.createElement("div");
          div.className = "test-result " + (result.pass ? "pass" : "fail");

          let content = `<strong>${description}</strong><br>
                    Expected: ${result.expected}<br>
                    Got: ${result.actual}<br>
                    ${result.pass ? "✅ PASS" : "❌ FAIL"}`;

          if (result.validationResult) {
            content += `<div class="validation-result">
                        Validation Result: ${JSON.stringify(
                          result.validationResult,
                          null,
                          2
                        )}
                    </div>`;
          }

          div.innerHTML = content;
          document.getElementById("test-results").appendChild(div);
          return result.pass;
        } catch (error) {
          const div = document.createElement("div");
          div.className = "test-result fail";
          div.innerHTML = `<strong>${description}</strong><br>
                    ERROR: ${error.message}<br>
                    ❌ FAIL`;
          document.getElementById("test-results").appendChild(div);
          return false;
        }
      }

      function addSection(title) {
        const section = document.createElement("div");
        section.className = "test-section";
        section.innerHTML = `<h3>${title}</h3>`;
        document.getElementById("test-results").appendChild(section);
      }

      // Test basic validation functionality
      addSection("Basic Validation Tests");

      const tests = [
        {
          desc: "Valid time slot with HH:MM format",
          test: () => {
            const result = validateTimeSlotAdvanced("09:00", "10:30", []);
            return {
              actual: result.success,
              expected: true,
              pass: result.success === true,
              validationResult: result,
            };
          },
        },
        {
          desc: "Valid time slot with AM/PM format",
          test: () => {
            const result = validateTimeSlotAdvanced("9:00 AM", "10:30 AM", []);
            return {
              actual: result.success && result.normalizedStartTime,
              expected: "success with 09:00",
              pass: result.success && result.normalizedStartTime === "09:00",
              validationResult: result,
            };
          },
        },
        {
          desc: "Invalid time format",
          test: () => {
            const result = validateTimeSlotAdvanced("invalid", "10:30", []);
            return {
              actual: result.success,
              expected: false,
              pass: result.success === false && result.errors.length > 0,
              validationResult: result,
            };
          },
        },
        {
          desc: "Start time after end time",
          test: () => {
            const result = validateTimeSlotAdvanced("11:00", "10:30", []);
            return {
              actual: result.success,
              expected: false,
              pass:
                result.success === false &&
                result.errors.some((e) => e.includes("before end time")),
              validationResult: result,
            };
          },
        },
      ];

      // Test overlap detection
      addSection("Overlap Detection Tests");

      const existingSlots = [
        { start: "09:00", end: "10:00", label: "Morning Slot" },
        { start: "14:00", end: "15:30", label: "Afternoon Slot" },
      ];

      tests.push(
        {
          desc: "Detect overlapping time slot",
          test: () => {
            const result = validateTimeSlotAdvanced(
              "09:30",
              "10:30",
              existingSlots
            );
            return {
              actual: result.success,
              expected: false,
              pass:
                result.success === false && result.conflictingSlots.length > 0,
              validationResult: result,
            };
          },
        },
        {
          desc: "Accept non-overlapping time slot",
          test: () => {
            const result = validateTimeSlotAdvanced(
              "10:00",
              "11:00",
              existingSlots
            );
            return {
              actual: result.success,
              expected: true,
              pass: result.success === true,
              validationResult: result,
            };
          },
        },
        {
          desc: "Sequential requirement - should start after last slot",
          test: () => {
            const result = validateTimeSlotAdvanced(
              "13:00",
              "14:00",
              existingSlots
            );
            return {
              actual: result.success,
              expected: false,
              pass:
                result.success === false &&
                result.errors.some((e) =>
                  e.includes("after the last existing slot")
                ),
              validationResult: result,
            };
          },
        }
      );

      // Test duration validation
      addSection("Duration Validation Tests");

      tests.push(
        {
          desc: "Duration too short (under 15 minutes)",
          test: () => {
            const result = validateTimeSlotAdvanced("10:00", "10:10", []);
            return {
              actual: result.success,
              expected: false,
              pass:
                result.success === false &&
                result.errors.some((e) => e.includes("too short")),
              validationResult: result,
            };
          },
        },
        {
          desc: "Duration acceptable (30 minutes)",
          test: () => {
            const result = validateTimeSlotAdvanced("10:00", "10:30", []);
            return {
              actual: result.duration,
              expected: 30,
              pass: result.success === true && result.duration === 30,
              validationResult: result,
            };
          },
        },
        {
          desc: "Duration too long (over 8 hours)",
          test: () => {
            const result = validateTimeSlotAdvanced("09:00", "18:00", []);
            return {
              actual: result.success,
              expected: false,
              pass:
                result.success === false &&
                result.errors.some((e) => e.includes("too long")),
              validationResult: result,
            };
          },
        }
      );

      // Test batch validation
      addSection("Batch Validation Tests");

      tests.push(
        {
          desc: "Validate multiple valid slots",
          test: () => {
            const timeSlots = [
              { start: "09:00", end: "10:00", label: "Slot 1" },
              { start: "10:00", end: "11:00", label: "Slot 2" },
              { start: "14:00", end: "15:00", label: "Slot 3" },
            ];
            const result = validateTimeSlotsBatch(timeSlots);
            return {
              actual: `${result.validSlots.length} valid, ${result.invalidSlots.length} invalid`,
              expected: "3 valid, 0 invalid",
              pass:
                result.validSlots.length === 3 &&
                result.invalidSlots.length === 0,
              validationResult: result,
            };
          },
        },
        {
          desc: "Detect conflicts in batch validation",
          test: () => {
            const timeSlots = [
              { start: "09:00", end: "10:30", label: "Slot 1" },
              { start: "10:00", end: "11:00", label: "Slot 2" },
            ];
            const result = validateTimeSlotsBatch(timeSlots);
            return {
              actual: result.conflicts.length,
              expected: "1 conflict",
              pass: result.conflicts.length === 1,
              validationResult: result,
            };
          },
        }
      );

      let passCount = 0;
      tests.forEach(({ desc, test }) => {
        if (runTest(desc, test)) passCount++;
      });

      const summary = document.createElement("div");
      summary.className = "test-group";
      summary.innerHTML = `<h3>Summary: ${passCount}/${tests.length} tests passed</h3>`;
      document.getElementById("test-results").appendChild(summary);
    </script>
  </body>
</html>
